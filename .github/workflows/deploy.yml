name: Deploy to VPS

on:
  push:
    branches: [main, master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy files via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          port: ${{ secrets.VPS_PORT || 22 }}
          username: ${{ secrets.VPS_USERNAME || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          source: "**"
          target: ${{ secrets.VPS_PROJECT_PATH || '/home/ubuntu/imposer-game-tg-bo/' }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          port: ${{ secrets.VPS_PORT || 22 }}
          username: ${{ secrets.VPS_USERNAME || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            set -e
            PROJECT_PATH="${{ secrets.VPS_PROJECT_PATH || '/home/ubuntu/imposer-game-tg-bo/' }}"
            cd "$PROJECT_PATH"

            # Force release stuck apt locks (only if apt is active)
            echo "Checking and releasing apt locks..."
            sudo killall apt apt-get 2>/dev/null || true
            sudo rm -f /var/lib/apt/lists/lock
            sudo rm -f /var/cache/apt/archives/lock
            sudo rm -f /var/lib/dpkg/lock*
            sudo dpkg --configure -a 2>/dev/null || true

            # Safe disk cleanup
            echo "Safe clean up of disk space..."
            sudo apt-get clean || true
            sudo rm -rf /var/cache/apt/archives/* || true
            sudo journalctl --vacuum-size=10M 2>/dev/null || true
            
            # Clean only Docker build cache
            if command -v docker &> /dev/null; then
              sudo docker builder prune -af || true
              sudo docker image prune -f || true
            fi

            # Install Docker if missing
            if ! command -v docker &> /dev/null; then
              echo "Installing Docker..."
              sudo apt-get update
              sudo apt-get install -y docker.io
              sudo systemctl start docker
              sudo systemctl enable docker
              sudo usermod -aG docker ${{ secrets.VPS_USERNAME || 'ubuntu' }}
            fi

            # Build and deploy Docker container
            sudo docker build -t imposter-tg-bot .
            sudo docker stop imposter-bot || true
            sudo docker rm imposter-bot || true
            # Touch db.sqlite on the host to prevent Docker from creating a directory
            touch "$PROJECT_PATH/db.sqlite"

            sudo docker run -d \
              --name imposter-bot \
              -e TELEGRAM_BOT_TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}" \
              -v "$PROJECT_PATH/db.sqlite:/app/db.sqlite" \
              -p 8080:7860 \
              --restart unless-stopped \
              imposter-tg-bot

            echo "Deployment finished successfully!"
